name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full toolchain. The dev tools (vitest 5, ESLint 10, attw) need Node 22+, so they run on 22 and 24;
  # the published package itself supports Node 18+ and is exercised on 18/20 by the `runtime` job below.
  build:
    name: Build and test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24, primary: true }
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        if: ${{ !matrix.primary }}
        run: npm test

      - name: Test with coverage
        if: ${{ matrix.primary }}
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Package checks (publint + attw)
        run: npm run check:package

      - name: Change-set check
        run: npm run check:changeset

      - name: Smoke test (pack, install, ESM + CJS)
        run: npm run test:smoke

      - name: Pack
        if: ${{ matrix.primary }}
        run: npm pack

      - uses: actions/upload-artifact@v7
        if: ${{ matrix.primary }}
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: ${{ matrix.primary }}
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Installs the packed tarball on every supported Node version and runs the ESM + CJS smoke scripts.
  runtime:
    name: Runtime (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: package

      - name: Smoke test packed package
        run: node scripts/smoke-test.mjs package/*.tgz
